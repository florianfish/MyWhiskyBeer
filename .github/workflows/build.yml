name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Workflow partagé : https://github.com/florianfish/Forge-Apk
jobs:
  build:
    uses: florianfish/Forge-Apk/.github/workflows/android-build.yml@main
    permissions:
      contents: write        # pré-release « debug »
      pull-requests: write   # commentaire sur les PR
    with:
      apk-name: MyWhiskyBeer-verif-release
      gradle-tasks: assembleRelease
      apk-path: app/build/outputs/apk/release/app-release.apk
      debug-release: false
