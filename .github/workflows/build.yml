name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Version de Gradle fixée par le wrapper du repo
      - uses: gradle/actions/setup-gradle@v6
      - name: Compilation et tests unitaires
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v7
        id: apk
        with:
          name: mywhiskybeer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Sur une PR : commentaire avec le lien de l'APK de debug, mis à jour à chaque push
      - name: Lien de l'APK dans la PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.apk.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="📦 **APK de debug** (commit ${SHA:0:7}) : [télécharger mywhiskybeer-apk]($URL)

          Fichier zip à décompresser ; lien valable 90 jours, connexion GitHub requise."
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body" \
            || gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
