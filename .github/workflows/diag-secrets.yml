name: Diagnostic secrets (temporaire)
on:
  push:
    branches: [tmp/diag-secrets]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # N'affiche que des longueurs et une empreinte, jamais les valeurs
      - env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            v="${!s}"
            t="$(printf '%s' "$v" | tr -d '[:space:]')"
            echo "DIAG $s longueur=${#v} sans_espaces=${#t}"
          done
          [ "$KEYSTORE_PASSWORD" = "$KEY_PASSWORD" ] && echo "DIAG mots_de_passe_identiques=oui" || echo "DIAG mots_de_passe_identiques=non"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > k.jks 2>/dev/null && echo "DIAG decode=ok" || echo "DIAG decode=erreur"
          echo "DIAG fichier=$(wc -c < k.jks) sha256=$(sha256sum k.jks | cut -c1-16)"
          keytool -list -keystore k.jks -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1 && echo "DIAG keystore_lisible=oui" || echo "DIAG keystore_lisible=non"
          rm -f k.jks
